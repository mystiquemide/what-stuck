name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whatstuck
          POSTGRES_PASSWORD: whatstuck
          POSTGRES_DB: whatstuck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatstuck -d whatstuck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://whatstuck:whatstuck@localhost:5432/whatstuck_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: $(go env GOPATH)/bin/gitleaks git --redact --no-banner -v

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whatstuck
          POSTGRES_PASSWORD: whatstuck
          POSTGRES_DB: whatstuck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatstuck -d whatstuck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://whatstuck:whatstuck@localhost:5432/whatstuck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate throwaway secrets for this run
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "IP_HASH_SALT=$(openssl rand -base64 24)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          npm run start > server.log 2>&1 &
          npx --yes wait-on --timeout 60000 http://localhost:3000
      - run: npm run test:e2e
      - if: failure()
        run: tail -n 100 server.log
